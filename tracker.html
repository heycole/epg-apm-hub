<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPG Team Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy:      #0C1232;
            --accent:    #CB792F;
            --bg:        #F5F3EF;
            --surface:   #FFFFFF;
            --border:    #E5E2DC;
            --text:      #1A1A1A;
            --text-sm:   #6B7280;
            --muted:     #9CA3AF;
            --success:   #16a34a;
            --danger:    #DC2626;
            --warning:   #F59E0B;
            --shadow:    0 1px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --radius:    10px;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; }

        /* Login */
        #loginOverlay { position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999; }
        #loginOverlay.hidden { display:none; }
        .login-card { background:#fff;border-radius:14px;padding:36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow-md); }
        .login-card h1 { font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:4px; }
        .login-card p  { font-size:13px;color:var(--text-sm);margin-bottom:24px; }
        .login-card input { width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;margin-bottom:10px; }
        .login-card input:focus { outline:none;border-color:var(--accent); }
        .btn-login { width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px; }
        .btn-login:disabled { opacity:0.6; }
        #loginError { font-size:12px;color:var(--danger);margin-top:8px;min-height:18px; }

        /* Shell */
        #app { display:flex;flex-direction:column;min-height:100vh; }
        header { background:var(--navy);color:#fff;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
        .header-logo { font-size:15px;font-weight:700;letter-spacing:.02em; }
        .header-logo span { color:var(--accent); }
        .header-right { display:flex;align-items:center;gap:12px; }
        .btn-signout { font-size:12px;color:rgba(255,255,255,0.6);background:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:'DM Sans',sans-serif; }
        .btn-signout:hover { color:#fff;border-color:rgba(255,255,255,0.5); }
        .tab-bar { background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center; }
        .tab { padding:14px 18px;font-size:13px;font-weight:600;color:var(--text-sm);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;user-select:none; }
        .tab:hover { color:var(--text); }
        .tab.active { color:var(--accent);border-bottom-color:var(--accent); }
        #content { flex:1;padding:24px;max-width:1300px;width:100%;margin:0 auto; }
        .tab-pane { display:none; }
        .tab-pane.active { display:block; }

        /* Buttons */
        .btn { display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s; }
        .btn-primary { background:var(--accent);color:#fff; }
        .btn-primary:hover { opacity:.9; }
        .btn-ghost { background:none;color:var(--text-sm);border:1px solid var(--border); }
        .btn-ghost:hover { background:var(--bg);color:var(--text); }
        .btn-sm { padding:4px 10px;font-size:12px; }
        .icon-btn { background:none;border:none;cursor:pointer;padding:2px 5px;font-size:14px;color:var(--muted); }
        .icon-btn:hover { color:var(--text); }

        /* Badges */
        .badge { display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em; }
        .badge-planning   { background:#EFF6FF;color:#1D4ED8; }
        .badge-active     { background:rgba(203,121,47,.12);color:var(--accent); }
        .badge-hold       { background:#FEF3C7;color:#B45309; }
        .badge-complete   { background:rgba(22,163,74,.1);color:var(--success); }
        .badge-archived   { background:var(--bg);color:var(--muted);border:1px solid var(--border); }

        /* Section header */
        .section-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:16px; }
        .section-title  { font-size:16px;font-weight:700;color:var(--navy); }
        .section-actions { display:flex;align-items:center;gap:8px; }

        /* Projects */
        .projects-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px; }
        .project-card { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border-top:3px solid var(--border);transition:box-shadow .15s; }
        .project-card:hover { box-shadow:var(--shadow-md); }
        .project-card.status-planning  { border-top-color:#3B82F6; }
        .project-card.status-active    { border-top-color:var(--accent); }
        .project-card.status-hold      { border-top-color:var(--warning); }
        .project-card.status-complete  { border-top-color:var(--success); }
        .project-card.status-archived  { border-top-color:var(--muted);opacity:.7; }
        .project-header { padding:14px 16px 10px;cursor:pointer;user-select:none; }
        .project-header-row { display:flex;align-items:flex-start;justify-content:space-between;gap:8px; }
        .project-name { font-size:14px;font-weight:700;color:var(--navy);flex:1; }
        .project-meta { display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--text-sm); }
        .project-actions { display:flex;align-items:center;gap:4px; }
        .project-chevron { font-size:13px;color:var(--muted);transition:transform .2s;display:inline-block; }
        .project-chevron.closed { transform:rotate(-90deg); }
        .progress-bar-bg  { height:4px;background:var(--border);border-radius:4px;overflow:hidden; }
        .progress-bar-fill { height:100%;background:var(--accent);border-radius:4px;transition:width .3s; }
        .project-body { padding:0 16px 14px; }
        .project-desc { font-size:12px;color:var(--text-sm);line-height:1.5;margin-bottom:10px; }
        .subtask-list { list-style:none;display:flex;flex-direction:column;gap:4px; }
        .subtask-item { display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px; }
        .subtask-item:last-child { border-bottom:none; }
        .subtask-item input[type="checkbox"] { accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;cursor:pointer; }
        .subtask-text { flex:1;cursor:pointer; }
        .subtask-text.done { text-decoration:line-through;color:var(--muted); }
        .subtask-assignee { font-size:11px;color:var(--text-sm);background:var(--bg);padding:1px 6px;border-radius:10px;white-space:nowrap; }
        .add-subtask-row { display:flex;gap:6px;margin-top:8px; }
        .add-subtask-row input { flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--text); }
        .add-subtask-row input:focus { outline:none;border-color:var(--accent); }
        .add-subtask-row select { padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;max-width:90px; }
        .add-subtask-row button { padding:5px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap; }

        /* Tasks kanban */
        .tasks-columns { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start; }
        .task-col { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden; }
        .task-col-header { padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--border); }
        .task-col.col-todo .task-col-header      { border-top-color:var(--border); }
        .task-col.col-inprogress .task-col-header { border-top-color:#3B82F6; }
        .task-col.col-done .task-col-header       { border-top-color:var(--success); }
        .task-col-title { font-size:13px;font-weight:700; }
        .task-col-count { font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--text-sm); }
        .task-col-body  { padding:10px;min-height:60px; }
        .task-card { background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--border); }
        .task-card-title { font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px; }
        .task-card-meta { display:flex;align-items:center;gap:6px;flex-wrap:wrap; }
        .assignee-pill { background:var(--surface);padding:1px 7px;border-radius:10px;border:1px solid var(--border);font-size:11px; } /* fallback only */
        .task-due      { color:var(--warning)!important;font-weight:600; }
        .task-overdue  { color:var(--danger)!important;font-weight:600; }
        .task-card-actions { display:flex;gap:4px;margin-top:6px;align-items:center; }
        .task-move-btn { font-size:11px;padding:2px 7px;border-radius:4px;cursor:pointer;border:none;background:var(--surface);color:var(--text-sm);font-family:'DM Sans',sans-serif; }
        .task-move-btn:hover { background:var(--accent);color:#fff; }
        .task-icon-btn { font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer; }
        .task-icon-btn:hover { color:var(--danger); }

        /* Assignee color pills */
        .ap { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap; }
        .ap-chris  { background:#DBEAFE;color:#1D4ED8; }
        .ap-mark   { background:#EDE9FE;color:#6D28D9; }
        .ap-cole   { background:#FEF3C7;color:#B45309; }
        .ap-diana  { background:#FCE7F3;color:#BE185D; }
        .ap-elan   { background:#D1FAE5;color:#065F46; }
        .ap-macoy  { background:#FFEDD5;color:#C2410C; }
        .ap-default{ background:#F3F4F6;color:#374151; }

        /* Top 3 priorities */
        .priority-cards { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px; }
        .priority-card  { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden; }
        .priority-card-header { padding:12px 16px;border-bottom:1px solid var(--border);border-top:3px solid var(--accent);display:flex;align-items:center;gap:8px; }
        .priority-card-name   { font-size:14px;font-weight:700;color:var(--navy); }
        .priority-card-body   { padding:12px 16px; }
        .priority-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
        .priority-num { width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
        .priority-input { flex:1;border:none;border-bottom:1px solid var(--border);padding:4px 2px;font-family:'DM Sans',sans-serif;font-size:13px;background:transparent;color:var(--text);outline:none; }
        .priority-input:focus { border-bottom-color:var(--accent); }
        .priority-input::placeholder { color:var(--muted); }

        /* Priority badges */
        .priority-high   { background:#FEE2E2;color:#B91C1C;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700; }
        .priority-medium { background:#FEF3C7;color:#B45309;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700; }
        .priority-low    { background:#F0FDF4;color:#15803D;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700; }

        /* Show archived toggle */
        .archive-toggle { font-size:12px;color:var(--text-sm);cursor:pointer;display:flex;align-items:center;gap:5px; }
        .archive-toggle:hover { color:var(--text); }
        .archived-section { margin-top:24px; }
        .archived-header { font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border); }

        /* EOD Report */
        .eod-date-nav { display:flex;align-items:center;gap:12px;margin-bottom:20px; }
        .eod-date-label { font-size:18px;font-weight:700;color:var(--navy); }
        .eod-nav-btn { background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--text-sm); }
        .eod-nav-btn:hover { background:var(--bg);color:var(--text); }
        .eod-empty { text-align:center;padding:40px;color:var(--muted);font-size:13px; }
        .eod-group { margin-bottom:24px; }
        .eod-group-header { font-size:13px;font-weight:700;color:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px; }
        .eod-item { display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border-radius:8px;margin-bottom:6px;border-left:3px solid var(--success); }
        .eod-item.archived { opacity:.5;border-left-color:var(--muted); }
        .eod-item-title { flex:1;font-size:13px;font-weight:600; }
        .eod-item-meta  { font-size:11px;color:var(--text-sm); }
        .eod-time { font-size:11px;color:var(--muted); }
        .eod-print-btn { margin-left:auto; }

        /* Today tab */
        .today-header { text-align:center;margin-bottom:20px; }
        .today-date-display { font-size:26px;font-weight:700;color:var(--navy); }
        .today-day-display  { font-size:14px;color:var(--text-sm);margin-top:2px; }
        .today-nav { display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px; }
        .today-nav-btn { background:none;border:1px solid var(--border);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px;color:var(--text-sm);font-family:'DM Sans',sans-serif; }
        .today-nav-btn:hover { background:var(--bg);color:var(--text); }
        .today-people { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px; }
        .person-col { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden; }
        .person-col-header { padding:12px 16px;border-bottom:1px solid var(--border);border-top:3px solid var(--accent); }
        .person-col-name { font-size:15px;font-weight:700;color:var(--navy); }
        .person-col-sub  { font-size:11px;color:var(--text-sm);margin-top:2px; }
        .person-col-body { padding:12px; }
        .person-task-item { display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px;border:1px solid var(--border); }
        .person-task-item.done { opacity:.55; }
        .person-task-check { accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;margin-top:1px;cursor:pointer; }
        .person-task-title { font-size:13px;font-weight:600;flex:1; }
        .person-task-title.done-text { text-decoration:line-through;color:var(--muted); }
        .person-task-proj  { font-size:11px;color:var(--accent); }
        .person-empty { padding:20px;text-align:center;color:var(--muted);font-size:12px; }
        .today-cal-section { margin-top:8px; }
        .today-cal-label { font-size:13px;font-weight:700;color:var(--text-sm);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em; }
        .today-cal-wrap { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden; }
        .today-cal-wrap iframe { width:100%;border:none;display:block; }

        /* Modals */
        .modal-bg { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;align-items:center;justify-content:center; }
        .modal-bg.open { display:flex; }
        .modal { background:var(--surface);border-radius:14px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md); }
        .modal h3 { font-size:16px;font-weight:700;color:var(--navy);margin-bottom:20px; }
        .form-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
        .form-group { display:flex;flex-direction:column;gap:5px;margin-bottom:14px; }
        .form-group label { font-size:12px;font-weight:600;color:var(--text-sm); }
        .form-group input, .form-group select, .form-group textarea { padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--text); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none;border-color:var(--accent); }
        .modal-actions { display:flex;justify-content:flex-end;gap:8px;margin-top:4px; }

        /* Utils */
        .empty { text-align:center;padding:32px 16px;color:var(--muted);font-size:13px; }
        .loading-ring { width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto; }
        @keyframes spin { to { transform:rotate(360deg); } }

        @media(max-width:720px) {
            .tasks-columns, .today-people, .form-row { grid-template-columns:1fr; }
            .projects-grid { grid-template-columns:1fr; }
            #content { padding:16px; }
        }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginOverlay">
    <div class="login-card">
        <h1>EPG Team Tracker</h1>
        <p>Projects · Tasks · EOD · Today</p>
        <form id="loginForm" onsubmit="handleAuth(event)">
            <input type="email" id="authEmail" placeholder="Email" required autocomplete="email">
            <input type="password" id="authPassword" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn-login" id="authBtn">Sign In</button>
        </form>
        <div id="loginError"></div>
        <p style="font-size:12px;color:var(--text-sm);margin-top:14px;">
            <span id="toggleText">Don't have an account?</span>
            <a href="#" id="toggleLink" onclick="toggleAuthMode();return false;" style="color:var(--accent);font-weight:600;">Sign Up</a>
        </p>
    </div>
</div>

<!-- App -->
<div id="app">
    <header>
        <div class="header-logo">EPG <span>Tracker</span></div>
        <div class="header-right">
            <span id="userLabel" style="font-size:12px;color:rgba(255,255,255,0.6);"></span>
            <button class="btn-signout" onclick="handleLogout()">Sign Out</button>
        </div>
    </header>

    <div class="tab-bar">
        <div class="tab active" data-tab="home"     onclick="switchTab('home')">🏠 Home</div>
        <div class="tab" data-tab="projects" onclick="switchTab('projects')">📁 Projects</div>
        <div class="tab" data-tab="tasks"    onclick="switchTab('tasks')">✓ Tasks</div>
        <div class="tab" data-tab="eod"      onclick="switchTab('eod')">📋 EOD Report</div>
        <div class="tab" data-tab="today"    onclick="switchTab('today')">📅 Today</div>
    </div>

    <div id="content">

        <!-- HOME -->
        <div class="tab-pane active" id="pane-home">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;" id="home-priorities"></div>
            <div>
                <div class="today-cal-label" style="margin-bottom:10px;">📅 EPGMGMT — Today</div>
                <div style="background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;">
                    <iframe id="home-cal-iframe" width="100%" height="520" style="border:none;display:block;"></iframe>
                </div>
            </div>
        </div>

        <!-- PROJECTS -->
        <div class="tab-pane" id="pane-projects">
            <div id="projects-loading"><div class="loading-ring"></div></div>
            <div id="projects-view" style="display:none;">
                <div class="section-header">
                    <span class="section-title">Projects</span>
                    <div class="section-actions">
                        <label class="archive-toggle"><input type="checkbox" id="showArchivedProjects" onchange="renderProjects()"> Show archived</label>
                        <button class="btn btn-primary" onclick="openProjectModal()">+ New Project</button>
                    </div>
                </div>
                <div class="projects-grid" id="projects-grid"></div>
            </div>
        </div>

        <!-- TASKS -->
        <div class="tab-pane" id="pane-tasks">
            <div class="section-header">
                <span class="section-title">Team Tasks</span>
                <div class="section-actions">
                    <label class="archive-toggle"><input type="checkbox" id="showArchivedTasks" onchange="renderTasks()"> Show archived</label>
                    <button class="btn btn-primary" onclick="openTaskModal()">+ New Task</button>
                </div>
            </div>
            <div class="tasks-columns">
                <div class="task-col col-todo">
                    <div class="task-col-header"><span class="task-col-title">To Do</span><span class="task-col-count" id="count-todo">0</span></div>
                    <div class="task-col-body" id="col-todo"></div>
                </div>
                <div class="task-col col-inprogress">
                    <div class="task-col-header"><span class="task-col-title">In Progress</span><span class="task-col-count" id="count-inprogress">0</span></div>
                    <div class="task-col-body" id="col-inprogress"></div>
                </div>
                <div class="task-col col-done">
                    <div class="task-col-header"><span class="task-col-title">Done</span><span class="task-col-count" id="count-done">0</span></div>
                    <div class="task-col-body" id="col-done"></div>
                </div>
            </div>
        </div>

        <!-- EOD REPORT -->
        <div class="tab-pane" id="pane-eod">
            <div class="section-header">

<script>
// ── Supabase ──────────────────────────────────────────
const SUPABASE_URL      = 'https://woyhzbnlkhmfuagryhis.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndveWh6Ym5sa2htZnVhZ3J5aGlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTAwNjIsImV4cCI6MjA5MjUyNjA2Mn0.E6Wmbgmx7-rDiCQ7dkKoIuo2orj6rddJnyRuCSVluq4';
const sb     = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const sbData = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });

// ── State ─────────────────────────────────────────────
let state = { projects:[], teamTasks:[], eodReport:{}, dailyPriorities:{} };
let saveTimer   = null;
let stateReady  = false;

async function loadState() {
    const { data } = await sbData.from('hub_state').select('state_data').eq('id','epg_tracker').single();
    if (data?.state_data) state = { projects:[], teamTasks:[], eodReport:{}, dailyPriorities:{}, ...data.state_data };
    stateReady = true;
}

function saveState() {
    if (!stateReady) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
        await sbData.from('hub_state').upsert({ id:'epg_tracker', state_data:state, updated_at:new Date().toISOString() });
    }, 350);
}

// ── Auth ──────────────────────────────────────────────
let isSignUp = false;
function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('authBtn').textContent    = isSignUp ? 'Create Account' : 'Sign In';
    document.getElementById('toggleText').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('toggleLink').textContent = isSignUp ? 'Sign In' : 'Sign Up';
    document.getElementById('loginError').textContent = '';
}
async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value;
    const pass  = document.getElementById('authPassword').value;
    const errEl = document.getElementById('loginError');
    const btn   = document.getElementById('authBtn');
    errEl.textContent = ''; btn.disabled = true;
    btn.textContent = isSignUp ? 'Creating...' : 'Signing in...';
    try {
        const r = isSignUp ? await sb.auth.signUp({ email, password:pass }) : await sb.auth.signInWithPassword({ email, password:pass });
        if (r.error) throw r.error;
    } catch(err) { errEl.textContent = err.message || 'Authentication failed'; }
    finally { btn.disabled = false; btn.textContent = isSignUp ? 'Create Account' : 'Sign In'; }
}
async function handleLogout() {
    await sb.auth.signOut();
    document.getElementById('loginOverlay').classList.remove('hidden');
}
sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('userLabel').textContent = session.user.email || '';
        await loadState();
        renderHome();
        renderProjects();
        renderTasks();
        renderEod();
        renderToday();
    }
});

// ── Tabs ──────────────────────────────────────────────
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tab));
    if (tab === 'home')  renderHome();
    if (tab === 'eod')   renderEod();
    if (tab === 'today') renderToday();
}

// ── Helpers ───────────────────────────────────────────
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function assigneePill(name) {
    const key = (name||'').toLowerCase().replace(/\s+/g,'');
    const cls = ['chris','mark','cole','diana','elan','macoy'].includes(key) ? `ap-${key}` : 'ap-default';
    return `<span class="ap ${cls}">👤 ${name}</span>`;
}
function toDateKey(d) { return d.toISOString().slice(0,10); }
function fmtDate(s) {
    if (!s) return '';
    return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function daysUntil(s) {
    if (!s) return null;
    return Math.ceil((new Date(s + 'T12:00:00') - new Date()) / 86400000);
}
function duePill(s) {
    if (!s) return '';
    const d = daysUntil(s);
    if (d < 0)   return `<span class="task-overdue">Overdue</span>`;
    if (d === 0) return `<span class="task-due">Due today</span>`;
    if (d <= 7)  return `<span class="task-due">Due in ${d}d</span>`;
    return `<span style="font-size:11px;color:var(--text-sm);">${fmtDate(s)}</span>`;
}
function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

// ── Home ──────────────────────────────────────────────
function renderHome() {
    const todayKey = toDateKey(new Date());
    const priData  = state.dailyPriorities?.[todayKey] || {};

    // Priority cards
    const priHtml = PEOPLE.map(person => {
        const vals  = priData[person] || ['','',''];
        const color = PERSON_COLORS[person] || 'var(--accent)';
        const key   = person.toLowerCase();
        const rows  = [0,1,2].map(i => `
            <div class="priority-row">
                <div class="priority-num" style="background:${color};">${i+1}</div>
                <input class="priority-input" type="text" placeholder="Priority ${i+1}…"
                    value="${(vals[i]||'').replace(/"/g,'&quot;')}"
                    onchange="savePriority('${person}',${i},this.value)"
                    onblur="savePriority('${person}',${i},this.value)">
            </div>`).join('');
        return `<div class="priority-card">
            <div class="priority-card-header" style="border-top-color:${color};">
                <span class="ap ap-${key}" style="font-size:13px;">👤 ${person}</span>
                <span class="priority-card-name" style="color:${color}; margin-left:8px;">Top 3 Today</span>
            </div>
            <div class="priority-card-body">${rows}</div>
        </div>`;
    }).join('');
    document.getElementById('home-priorities').innerHTML = priHtml;

    // Calendar — today only
    const ds = toDateKey(new Date()).replace(/-/g,'');
    document.getElementById('home-cal-iframe').src =
        `https://calendar.google.com/calendar/embed?src=c_q2pjqh2jr9mjmlgeqob1k1814c%40group.calendar.google.com&ctz=America%2FNew_York&mode=DAY&dates=${ds}&showNav=0&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&bgcolor=%23ffffff`;
}

// ── EOD helpers ───────────────────────────────────────
function addToEod(task) {
    if (!state.eodReport) state.eodReport = {};
    const key = toDateKey(new Date());
    if (!state.eodReport[key]) state.eodReport[key] = [];
    // avoid duplicate
    if (!state.eodReport[key].find(e => e.taskId === task.id)) {
        const proj = (state.projects||[]).find(p => p.id === task.projectId);
        state.eodReport[key].push({
            id:         uid(),
            taskId:     task.id,
            title:      task.title,
            assignee:   task.assignee || '',
            projectName: proj?.name || '',
            completedAt: new Date().toISOString(),
            archived:   false
        });
    }
}
function removeFromEod(taskId) {
    if (!state.eodReport) return;
    Object.keys(state.eodReport).forEach(k => {
        state.eodReport[k] = state.eodReport[k].filter(e => e.taskId !== taskId);
    });
}

// ── EOD date nav ──────────────────────────────────────
let eodDateOffset = 0;
function eodDate() {
    const d = new Date();
    d.setDate(d.getDate() + eodDateOffset);
    return d;
}
function shiftEodDate(n) { eodDateOffset += n; renderEod(); }

function renderEod() {
    const d   = eodDate();
    const key = toDateKey(d);
    document.getElementById('eod-date-label').textContent =
        d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

    const entries = ((state.eodReport || {})[key] || []).filter(e => !e.archived);
    const archived = ((state.eodReport || {})[key] || []).filter(e => e.archived);
    const body = document.getElementById('eod-body');

    if (!entries.length && !archived.length) {
        body.innerHTML = '<div class="eod-empty">No completed tasks for this day.</div>';
        return;
    }

    // group by assignee
    const byAssignee = {};
    entries.forEach(e => {
        const who = e.assignee || 'Unassigned';
        if (!byAssignee[who]) byAssignee[who] = [];
        byAssignee[who].push(e);
    });

    let html = '';
    Object.keys(byAssignee).forEach(who => {
        html += `<div class="eod-group">
            <div class="eod-group-header">👤 ${who} <span style="font-size:11px;font-weight:400;color:var(--muted);">${byAssignee[who].length} task${byAssignee[who].length===1?'':'s'}</span></div>`;
        byAssignee[who].forEach(e => {
            html += `<div class="eod-item" id="eod-${e.id}">
                <span style="font-size:16px;">✅</span>
                <div style="flex:1;">
                    <div class="eod-item-title">${e.title}</div>
                    ${e.projectName ? `<div class="eod-item-meta">📁 ${e.projectName}</div>` : ''}
                </div>
                <span class="eod-time">${fmtTime(e.completedAt)}</span>
                <button class="icon-btn" onclick="archiveEodItem('${key}','${e.id}')" title="Archive">🗄️</button>
            </div>`;
        });
        html += '</div>';
    });

    if (archived.length) {
        html += `<details style="margin-top:16px;">
            <summary style="cursor:pointer;font-size:12px;color:var(--muted);user-select:none;">🗄️ ${archived.length} archived item${archived.length===1?'':''}</summary>
            <div style="margin-top:8px;">`;
        archived.forEach(e => {
            html += `<div class="eod-item archived">
                <span style="font-size:16px;">✅</span>
                <div style="flex:1;"><div class="eod-item-title">${e.title}</div></div>
                <span class="eod-time">${fmtTime(e.completedAt)}</span>
                <button class="icon-btn" onclick="unarchiveEodItem('${key}','${e.id}')" title="Restore">↩️</button>
            </div>`;
        });
        html += '</div></details>';
    }

    body.innerHTML = html;
}

function archiveEodItem(dateKey, id) {
    const e = (state.eodReport[dateKey]||[]).find(x => x.id === id);
    if (e) { e.archived = true; saveState(); renderEod(); }
}
function unarchiveEodItem(dateKey, id) {
    const e = (state.eodReport[dateKey]||[]).find(x => x.id === id);
    if (e) { e.archived = false; saveState(); renderEod(); }
}

// ── Today tab ─────────────────────────────────────────
let todayOffset = 0;
function todayDate() {
    const d = new Date();
    d.setDate(d.getDate() + todayOffset);
    return d;
}
function shiftTodayDate(n) { todayOffset += n; renderToday(); }
function goToToday() { todayOffset = 0; renderToday(); }

const PEOPLE = ['Chris', 'Macoy'];
const PERSON_COLORS = { Chris:'#1D4ED8', Macoy:'#C2410C' };

function savePriority(person, idx, val) {
    if (!state.dailyPriorities) state.dailyPriorities = {};
    const key = toDateKey(todayDate());
    if (!state.dailyPriorities[key]) state.dailyPriorities[key] = {};
    if (!state.dailyPriorities[key][person]) state.dailyPriorities[key][person] = ['','',''];
    state.dailyPriorities[key][person][idx] = val;
    saveState();
}

function renderToday() {
    const d = todayDate();
    document.getElementById('today-date-display').textContent =
        d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
    document.getElementById('today-day-display').textContent =
        d.toLocaleDateString('en-US', { weekday:'long' });

    const todayKey = toDateKey(d);

    // ── Task columns ──
    const allTasks = (state.teamTasks || []).filter(t => !t.archived);
    const eodToday = (state.eodReport?.[todayKey] || []).map(e => e.taskId);

    const peopleHtml = PEOPLE.map(person => {
        const tasks = allTasks.filter(t => t.assignee === person);
        const open  = tasks.filter(t => t.status !== 'done');
        const doneToday = tasks.filter(t => t.status === 'done' && eodToday.includes(t.id));

        let items = '';
        open.forEach(t => {
            const proj = (state.projects||[]).find(p => p.id === t.projectId);
            const priLabel = t.priority === 'high' ? '<span class="priority-high" style="font-size:10px;">HIGH</span> ' : t.priority === 'medium' ? '<span class="priority-medium" style="font-size:10px;">MED</span> ' : '';
            items += `<div class="person-task-item">
                <input type="checkbox" class="person-task-check" onchange="moveTask('${t.id}','done',true)" title="Mark done">
                <div style="flex:1;">
                    <div class="person-task-title">${priLabel}${t.title}</div>
                    ${proj ? `<div class="person-task-proj">📁 ${proj.name}</div>` : ''}
                    ${t.dueDate ? `<div style="font-size:11px;">${duePill(t.dueDate)}</div>` : ''}
                </div>
            </div>`;
        });
        doneToday.forEach(t => {
            items += `<div class="person-task-item done">
                <input type="checkbox" class="person-task-check" checked disabled>
                <div><div class="person-task-title done-text">${t.title}</div></div>
            </div>`;
        });
        if (!open.length && !doneToday.length) items = '<div class="person-empty">No tasks assigned</div>';

        return `<div class="person-col">
            <div class="person-col-header" style="border-top-color:${PERSON_COLORS[person]||'var(--accent)'};">
                <div class="person-col-name">${person}</div>
                <div class="person-col-sub">${open.length} open · ${doneToday.length} done today</div>
            </div>
            <div class="person-col-body">${items}</div>
        </div>`;
    }).join('');

    document.getElementById('today-people').innerHTML = peopleHtml;
}

// ── Projects ──────────────────────────────────────────
let editProjectId = null;

function renderProjects() {
    document.getElementById('projects-loading').style.display = 'none';
    document.getElementById('projects-view').style.display   = 'block';
    const showArchived = document.getElementById('showArchivedProjects')?.checked;
    const projects = (state.projects || []).filter(p => showArchived ? p.archived : !p.archived);
    const ORDER = { active:0, planning:1, hold:2, complete:3 };
    const sorted = [...projects].sort((a,b) => (ORDER[a.status]??9) - (ORDER[b.status]??9));
    const grid = document.getElementById('projects-grid');
    grid.innerHTML = sorted.length ? sorted.map(p => projectCardHtml(p)).join('') : '<div class="empty">No projects yet — click "+ New Project" to get started.</div>';
}

function projectCardHtml(p) {
    const tasks = p.tasks || [];
    const done  = tasks.filter(t => t.done).length;
    const pct   = tasks.length ? Math.round((done/tasks.length)*100) : 0;
    const isOpen = localStorage.getItem('epg_proj_open_'+p.id) !== 'false';
    const badgeMap  = { planning:'badge-planning', active:'badge-active', hold:'badge-hold', complete:'badge-complete' };
    const labelMap  = { planning:'Planning', active:'Active', hold:'On Hold', complete:'Complete' };
    const statusCls = p.archived ? 'status-archived' : ('status-' + p.status);

    const subtasksHtml = tasks.map(t => `
        <li class="subtask-item">
            <input type="checkbox" ${t.done?'checked':''} onchange="toggleSubtask('${p.id}','${t.id}',this.checked)">
            <span class="subtask-text ${t.done?'done':''}" onclick="toggleSubtask('${p.id}','${t.id}',${!t.done})">${t.title}</span>
            ${t.assignee ? `<span class="subtask-assignee">${t.assignee}</span>` : ''}
            <button class="icon-btn" onclick="deleteSubtask('${p.id}','${t.id}')" title="Remove" style="font-size:12px;">×</button>
        </li>`).join('');

    return `<div class="project-card ${statusCls}" id="projcard-${p.id}">
        <div class="project-header" onclick="toggleProject('${p.id}')">
            <div class="project-header-row">
                <span class="project-name">${p.name}</span>
                <div class="project-actions">
                    ${p.archived ? '<span class="badge badge-archived">Archived</span>' : `<span class="badge ${badgeMap[p.status]||''}">${labelMap[p.status]||p.status}</span>`}
                    ${p.priority === 'high'   ? '<span class="priority-high">HIGH</span>'   : ''}
                    ${p.priority === 'medium' ? '<span class="priority-medium">MED</span>'  : ''}
                    ${p.priority === 'low'    ? '<span class="priority-low">LOW</span>'     : ''}
                    <button class="icon-btn" onclick="event.stopPropagation();openProjectModal('${p.id}')" title="Edit">✏️</button>
                    ${p.archived
                        ? `<button class="icon-btn" onclick="event.stopPropagation();unarchiveProject('${p.id}')" title="Restore">↩️</button>`
                        : `<button class="icon-btn" onclick="event.stopPropagation();archiveProject('${p.id}')" title="Archive">🗄️</button>`}
                    <span class="project-chevron ${isOpen?'open':'closed'}">▾</span>
                </div>
            </div>
            <div class="project-meta">
                ${p.owner ? assigneePill(p.owner) : ''}
                ${p.dueDate ? `<span>📅 ${fmtDate(p.dueDate)}</span>` : ''}
                ${tasks.length ? `<span style="margin-left:auto;">${done}/${tasks.length} done</span>` : ''}
            </div>
        </div>
        ${tasks.length ? `<div style="padding:0 16px 6px;"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div>` : ''}
        <div id="projbody-${p.id}" style="${isOpen?'':'display:none;'}">
            <div class="project-body">
                ${p.description ? `<div class="project-desc">${p.description}</div>` : ''}
                <ul class="subtask-list">${subtasksHtml}</ul>
                <div class="add-subtask-row">
                    <input type="text" id="subtask-input-${p.id}" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addSubtask('${p.id}')">
                    <select id="subtask-assignee-${p.id}">
                        <option value="">Who</option><option>Chris</option><option>Macoy</option><option>Cole</option><option>Diana</option><option>Elan</option>
                    </select>
                    <button onclick="addSubtask('${p.id}')">+ Add</button>
                </div>
            </div>
        </div>
    </div>`;
}

function toggleProject(id) {
    const body = document.getElementById('projbody-'+id);
    const chev = document.querySelector(`#projcard-${id} .project-chevron`);
    if (!body) return;
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : '';
    if (chev) { chev.classList.toggle('open',!open); chev.classList.toggle('closed',open); }
    localStorage.setItem('epg_proj_open_'+id, String(!open));
}

function openProjectModal(id) {
    editProjectId = id || null;
    const p = id ? (state.projects||[]).find(x => x.id===id) : null;
    document.getElementById('projectModalTitle').textContent = p ? 'Edit Project' : 'New Project';
    document.getElementById('pName').value     = p?.name     || '';
    document.getElementById('pStatus').value   = p?.status   || 'active';
    document.getElementById('pPriority').value = p?.priority || '';
    document.getElementById('pOwner').value    = p?.owner    || '';
    document.getElementById('pDue').value      = p?.dueDate  || '';
    document.getElementById('pDesc').value     = p?.description || '';
    document.getElementById('projectModal').classList.add('open');
    setTimeout(() => document.getElementById('pName').focus(), 50);
}
function closeProjectModal() { document.getElementById('projectModal').classList.remove('open'); editProjectId=null; }

function saveProject() {
    const name = document.getElementById('pName').value.trim();
    if (!name) return alert('Project name is required.');
    if (editProjectId) {
        const p = (state.projects||[]).find(x => x.id===editProjectId);
        if (p) { p.name=name; p.status=document.getElementById('pStatus').value; p.priority=document.getElementById('pPriority').value; p.owner=document.getElementById('pOwner').value; p.dueDate=document.getElementById('pDue').value; p.description=document.getElementById('pDesc').value.trim(); }
    } else {
        if (!state.projects) state.projects=[];
        state.projects.push({ id:uid(), name, status:document.getElementById('pStatus').value, priority:document.getElementById('pPriority').value, owner:document.getElementById('pOwner').value, dueDate:document.getElementById('pDue').value, description:document.getElementById('pDesc').value.trim(), tasks:[], archived:false, createdAt:new Date().toISOString() });
    }
    saveState(); closeProjectModal(); renderProjects();
}

function archiveProject(id) {
    const p = (state.projects||[]).find(x => x.id===id);
    if (p) { p.archived=true; saveState(); renderProjects(); }
}
function unarchiveProject(id) {
    const p = (state.projects||[]).find(x => x.id===id);
    if (p) { p.archived=false; saveState(); renderProjects(); }
}

function addSubtask(projectId) {
    const input    = document.getElementById('subtask-input-'+projectId);
    const assignee = document.getElementById('subtask-assignee-'+projectId);
    const title = input?.value?.trim();
    if (!title) return;
    const p = (state.projects||[]).find(x => x.id===projectId);
    if (!p) return;
    if (!p.tasks) p.tasks=[];
    p.tasks.push({ id:uid(), title, done:false, assignee:assignee?.value||'', createdAt:new Date().toISOString() });
    localStorage.setItem('epg_proj_open_'+projectId, 'true');
    saveState(); renderProjects();
}
function toggleSubtask(projectId, taskId, done) {
    const p = (state.projects||[]).find(x => x.id===projectId);
    const t = p?.tasks?.find(x => x.id===taskId);
    if (t) { t.done=done; localStorage.setItem('epg_proj_open_'+projectId,'true'); saveState(); renderProjects(); }
}
function deleteSubtask(projectId, taskId) {
    const p = (state.projects||[]).find(x => x.id===projectId);
    if (p) { p.tasks=p.tasks.filter(t => t.id!==taskId); localStorage.setItem('epg_proj_open_'+projectId,'true'); saveState(); renderProjects(); }
}

// ── Tasks ─────────────────────────────────────────────
function renderTasks() {
    const showArchived = document.getElementById('showArchivedTasks')?.checked;
    const tasks = (state.teamTasks||[]).filter(t => showArchived ? t.archived : !t.archived);
    const cols = { todo:[], inprogress:[], done:[] };
    tasks.forEach(t => { if (cols[t.status]) cols[t.status].push(t); });

    ['todo','inprogress','done'].forEach(status => {
        const col   = document.getElementById('col-'+status);
        const count = document.getElementById('count-'+status);
        count.textContent = cols[status].length;
        col.innerHTML = cols[status].length ? cols[status].map(t => taskCardHtml(t,status)).join('') : '<div class="empty" style="padding:16px;">Nothing here</div>';
    });

    const sel = document.getElementById('tProject');
    if (sel) {
        const cur = sel.value;
        sel.innerHTML = '<option value="">— None —</option>' + (state.projects||[]).filter(p=>!p.archived).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        sel.value = cur;
    }
}

function taskCardHtml(t, status) {
    const mvBtns = { todo:[['inprogress','→ In Progress']], inprogress:[['todo','← To Do'],['done','✓ Done']], done:[['inprogress','← In Progress']] };
    const proj = (state.projects||[]).find(p => p.id===t.projectId);
    const moves = (mvBtns[status]||[]).map(([s,lbl]) => `<button class="task-move-btn" onclick="moveTask('${t.id}','${s}')">${lbl}</button>`).join('');
    return `<div class="task-card">
        <div class="task-card-title">${t.title}</div>
        <div class="task-card-meta">
            ${t.priority === 'high'   ? '<span class="priority-high">HIGH</span>'   : ''}
            ${t.priority === 'medium' ? '<span class="priority-medium">MED</span>'  : ''}
            ${t.priority === 'low'    ? '<span class="priority-low">LOW</span>'     : ''}
            ${t.assignee ? assigneePill(t.assignee) : ''}
            ${duePill(t.dueDate)}
            ${proj ? `<span style="font-size:11px;color:var(--accent);">📁 ${proj.name}</span>` : ''}
        </div>
        <div class="task-card-actions">
            ${moves}
            <button class="task-icon-btn" style="margin-left:auto;" onclick="openTaskModal('${t.id}')" title="Edit">✏️</button>
            <button class="task-icon-btn" onclick="${t.archived ? `unarchiveTask('${t.id}')` : `archiveTask('${t.id}')`}" title="${t.archived?'Restore':'Archive'}">${t.archived?'↩️':'🗄️'}</button>
        </div>
    </div>`;
}

function moveTask(id, newStatus, fromToday) {
    const t = (state.teamTasks||[]).find(x => x.id===id);
    if (!t) return;
    const wasNotDone = t.status !== 'done';
    t.status = newStatus;
    if (newStatus === 'done' && wasNotDone) addToEod(t);
    if (newStatus !== 'done') removeFromEod(id);
    saveState();
    renderTasks();
    renderToday();
    if (document.getElementById('pane-eod').classList.contains('active')) renderEod();
}

let editTaskId = null;

function openTaskModal(id) {
    editTaskId = id || null;
    const t = id ? (state.teamTasks||[]).find(x => x.id === id) : null;
    document.getElementById('taskModalTitle').textContent = t ? 'Edit Task' : 'New Task';
    document.getElementById('taskSaveBtn').textContent = t ? 'Save Changes' : 'Add Task';
    document.getElementById('tTitle').value    = t?.title    || '';
    document.getElementById('tAssignee').value = t?.assignee || '';
    document.getElementById('tDue').value      = t?.dueDate  || '';
    document.getElementById('tStatus').value   = t?.status   || 'todo';
    document.getElementById('tPriority').value = t?.priority || '';
    const sel = document.getElementById('tProject');
    sel.innerHTML = '<option value="">— None —</option>' + (state.projects||[]).filter(p=>!p.archived).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    sel.value = t?.projectId || '';
    document.getElementById('taskModal').classList.add('open');
    setTimeout(() => document.getElementById('tTitle').focus(), 50);
}
function closeTaskModal() { document.getElementById('taskModal').classList.remove('open'); editTaskId = null; }

function saveTask() {
    const title = document.getElementById('tTitle').value.trim();
    if (!title) return alert('Task title is required.');
    if (!state.teamTasks) state.teamTasks = [];

    if (editTaskId) {
        const t = state.teamTasks.find(x => x.id === editTaskId);
        if (t) {
            const wasNotDone = t.status !== 'done';
            t.title     = title;
            t.assignee  = document.getElementById('tAssignee').value;
            t.dueDate   = document.getElementById('tDue').value;
            t.priority  = document.getElementById('tPriority').value;
            t.projectId = document.getElementById('tProject').value;
            const newStatus = document.getElementById('tStatus').value;
            t.status = newStatus;
            if (newStatus === 'done' && wasNotDone) addToEod(t);
            if (newStatus !== 'done') removeFromEod(t.id);
        }
    } else {
        const t = { id:uid(), title, assignee:document.getElementById('tAssignee').value, dueDate:document.getElementById('tDue').value, priority:document.getElementById('tPriority').value, status:document.getElementById('tStatus').value, projectId:document.getElementById('tProject').value, archived:false, createdAt:new Date().toISOString() };
        state.teamTasks.push(t);
        if (t.status === 'done') addToEod(t);
    }
    saveState(); closeTaskModal(); renderTasks(); renderToday();
}

function archiveTask(id) {
    const t = (state.teamTasks||[]).find(x => x.id===id);
    if (t) { t.archived=true; saveState(); renderTasks(); renderToday(); }
}
function unarchiveTask(id) {
    const t = (state.teamTasks||[]).find(x => x.id===id);
    if (t) { t.archived=false; saveState(); renderTasks(); renderToday(); }
}

// Close modals on backdrop click
document.getElementById('projectModal').addEventListener('click', e => { if (e.target.id==='projectModal') closeProjectModal(); });
document.getElementById('taskModal').addEventListener('click',   e => { if (e.target.id==='taskModal')   closeTaskModal(); });
</script>
</body>
